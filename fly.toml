app = "delay-radar"
primary_region = "fra"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  DELAY_RADAR_DATA = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10m"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1024mb"

[[mounts]]
  source = "delay_radar_data"
  destination = "/data"
